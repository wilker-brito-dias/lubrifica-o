<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c141d">
<title>Administração HF28</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0c141d;--ink:#e8eef5;--mut:#8ea0b3;--acc:#f5a524;--ok:#3ddc97;--bad:#ff6b6b;--line:rgba(255,255,255,.13);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 85% -10%,#21405f 0,transparent 62%),radial-gradient(700px 420px at -10% 110%,#3a2a10 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
#main{max-width:720px;margin:0 auto;display:grid;gap:16px;padding-top:16px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .3em}
p{margin:.3em 0}
.m{color:var(--mut)}
.g{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:22px}
.b{display:block;width:100%;min-height:58px;margin-top:12px;padding:14px 18px;font:inherit;font-weight:600;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.b.p{background:var(--acc);border-color:var(--acc);color:#1b1200}
.b.d{color:var(--bad);border-color:rgba(255,107,107,.5)}
.b:focus-visible,input:focus-visible,select:focus-visible,#nav button:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
label{display:block;margin-top:16px;color:var(--mut);font-size:.95rem}
input,select{display:block;width:100%;margin-top:6px;padding:14px;font:inherit;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px}
.ls{list-style:none;margin:14px 0 0;padding:0}
.ls li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ls span{display:block}
.lt{text-align:right;font-weight:700;white-space:nowrap}
.x{display:block;margin:4px 0 0 auto;background:none;border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:8px 14px;font:inherit}
.warn{padding:12px 14px;border-radius:14px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffb3b3}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(12,20,29,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav button{flex:1;min-height:56px;font:inherit;font-weight:600;color:var(--mut);background:none;border:1px solid transparent;border-radius:16px}
#nav button.on{color:var(--acc);border-color:var(--acc);background:rgba(245,165,36,.1)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;padding:14px 18px;border-radius:14px;background:#12382b;border:1px solid var(--ok);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.bad{background:#3a1717;border-color:var(--bad)}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"><button data-t="r" onclick="TAB='r';draw()">Registros</button><button data-t="p" onclick="TAB='p';draw()">Pessoas</button><button data-t="m" onclick="TAB='m';draw()">Máquinas</button><button onclick="location.href='index.html'">Voltar</button></nav>
<div id="toast" role="status"></div>
<script src="gh.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const box=h=>$('#main').innerHTML='<section class="g">'+h+'</section>';
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='show'+(bad?' bad':'');clearTimeout(toast.k);toast.k=setTimeout(()=>e.className='',4000)}
let TAB='r',F='',ROWS=[],CAD={pessoas:[],maquinas:[]};
const qry=(d,q)=>{const st=d.prepare(q),o=[];while(st.step())o.push(st.getAsObject());st.free();return o};

/* PIN de administrador (trava simples neste aparelho) */
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function lock(){
  if(!GH.ok()){box('<h1>Administração</h1><p class="m">Configure o GitHub em Ajustes do app primeiro.</p><button class="b p" onclick="location.href=\'index.html#ajustes\'">Abrir ajustes</button>');return}
  box('<h1>Administração</h1><label>'+(localStorage.getItem('pin')?'PIN de administrador':'Crie um PIN de 4 a 8 dígitos')+'<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><button class="b p" onclick="unlock()">Entrar</button>');
}
async function unlock(){
  const p=$('#pin').value,h=localStorage.getItem('pin');
  if(p.length<4){toast('Use pelo menos 4 dígitos.',1);return}
  const x=await sha(p);
  if(!h)localStorage.setItem('pin',x);else if(x!==h){toast('PIN incorreto.',1);return}
  load();
}

/* Leitura e gravação */
async function load(){
  box('<p class="m">Lendo o banco no GitHub...</p>');
  try{
    const cur=await GH.read(),S=await GH.sql(),d=cur?new S.Database(cur.bytes):new S.Database();
    d.run(GH.SCHEMA);
    ROWS=qry(d,'SELECT * FROM abastecimentos ORDER BY fim DESC');
    CAD={pessoas:qry(d,'SELECT * FROM pessoas ORDER BY nome'),maquinas:qry(d,'SELECT * FROM maquinas ORDER BY nome')};
    d.close();draw();
  }catch(e){box('<h1>Administração</h1><p class="warn">Não foi possível ler o banco: '+esc((e&&e.message)||e)+'</p><button class="b" onclick="load()">Tentar de novo</button>')}
}
async function run(fn,msg,ok){
  try{await GH.edit(fn,msg);toast(ok||'Salvo no banco.');await load();return true}
  catch(e){const m=(e&&e.message)||String(e);toast(/UNIQUE/.test(m)?'Este código NFC já está cadastrado.':'Falha: '+m,1);return false}
}

/* Telas */
const localReg=()=>{try{return JSON.parse(localStorage.getItem('reg')||'{}')}catch(e){return{}}};
const pend=t=>{const r=localReg()[t==='pessoas'?'w':'m']||{};return Object.keys(r).filter(id=>!CAD[t].some(x=>x.nfc===id)).length};
function draw(){
  document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  if(TAB==='r'){
    const ms=[...new Set(ROWS.map(r=>r.maquina))].sort(),rows=F?ROWS.filter(r=>r.maquina===F):ROWS;
    $('#main').innerHTML='<section class="g"><h1>Registros</h1><label>Máquina<select onchange="F=this.value;draw()"><option value="">Todas</option>'+ms.map(m=>'<option'+(m===F?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></label><ul class="ls">'
      +(rows.slice(0,100).map(r=>'<li><div><b>'+esc(r.maquina)+'</b><span class="m">'+esc(r.colaborador)+', '+new Date(r.fim).toLocaleString('pt-BR')+'</span></div><div class="lt">'+fmt(r.litros)+' L<button class="x" data-u="'+esc(r.uid)+'" onclick="fRec(this.dataset.u)">Editar</button></div></li>').join('')||'<li class="m">Nenhum registro no banco.</li>')+'</ul></section>';
  }else{
    const p=TAB==='p',t=p?'pessoas':'maquinas',k=p?'p':'m',n=pend(t);
    $('#main').innerHTML='<section class="g"><h1>'+(p?'Pessoas':'Máquinas')+'</h1><button class="b p" onclick="fCad(\''+k+'\')">Adicionar '+(p?'pessoa':'máquina')+'</button>'
      +(n?'<button class="b" onclick="importar(\''+k+'\')">Importar '+n+' do tablet</button>':'')+'<ul class="ls">'
      +(CAD[t].map(x=>'<li><div><b>'+esc(x.nome)+'</b><span class="m">NFC '+esc(x.nfc)+'</span></div><button class="x" data-u="'+esc(x.uid)+'" onclick="fCad(\''+k+'\',this.dataset.u)">Editar</button></li>').join('')||'<li class="m">Nada cadastrado ainda.</li>')+'</ul></section>';
  }
}
function fRec(u){
  const r=ROWS.find(x=>x.uid===u),opt=(l,cur)=>'<option value="">(manter) '+esc(cur)+'</option>'+l.map(x=>'<option value="'+esc(x.uid)+'">'+esc(x.nome)+'</option>').join('');
  box('<h1>Editar registro</h1><p class="m">'+new Date(r.fim).toLocaleString('pt-BR')+'</p>'
    +'<label>Litros<input id="el" type="number" step="0.01" inputmode="decimal" value="'+esc(r.litros)+'"></label>'
    +'<label>Colaborador<select id="ep">'+opt(CAD.pessoas,r.colaborador)+'</select></label>'
    +'<label>Máquina<select id="em">'+opt(CAD.maquinas,r.maquina)+'</select></label>'
    +'<label>Observação<input id="eo" value="'+esc(r.obs)+'"></label>'
    +'<button class="b p" onclick="saveRec(\''+esc(u)+'\')">Salvar</button><button class="b d" onclick="delRec(\''+esc(u)+'\')">Excluir registro</button><button class="b" onclick="draw()">Cancelar</button>');
}
async function saveRec(u){
  const l=parseFloat(($('#el').value||'').replace(',','.'));
  if(!(l>=0)){toast('Informe um valor de litros válido.',1);return}
  const o=$('#eo').value.trim(),p=CAD.pessoas.find(x=>x.uid===$('#ep').value),m=CAD.maquinas.find(x=>x.uid===$('#em').value);
  await run(d=>{
    d.run('UPDATE abastecimentos SET litros=?,obs=? WHERE uid=?',[l,o,u]);
    if(p)d.run('UPDATE abastecimentos SET colaborador=?,cracha_id=? WHERE uid=?',[p.nome,p.nfc,u]);
    if(m)d.run('UPDATE abastecimentos SET maquina=?,totem_id=? WHERE uid=?',[m.nome,m.nfc,u]);
  },'admin: editar registro');
}
async function delRec(u){
  if(!confirm('Excluir este abastecimento do banco? Não dá para desfazer.'))return;
  const r=ROWS.find(x=>x.uid===u);
  if(await run(d=>d.run('DELETE FROM abastecimentos WHERE uid=?',[u]),'admin: excluir registro','Registro excluído.')&&r&&r.foto)GH.del(r.foto).catch(()=>{});
}
function fCad(k,u){
  const t=k==='p'?'pessoas':'maquinas',x=u?CAD[t].find(y=>y.uid===u):{nome:'',nfc:''},w=k==='p'?'pessoa':'máquina';
  box('<h1>'+(u?'Editar ':'Nova ')+w+'</h1><label>Nome<input id="fn" value="'+esc(x.nome)+'"></label>'
    +'<label>Código NFC<input id="fc" value="'+esc(x.nfc)+'" autocapitalize="off" autocomplete="off"></label><button class="b" onclick="lerNfc()">Ler NFC agora</button>'
    +'<button class="b p" onclick="saveCad(\''+k+'\',\''+(u||'')+'\')">Salvar</button>'
    +(u?'<button class="b d" onclick="delCad(\''+k+'\',\''+u+'\')">Excluir '+w+'</button>':'')+'<button class="b" onclick="draw()">Cancelar</button>');
}
async function saveCad(k,u){
  const t=k==='p'?'pessoas':'maquinas',n=$('#fn').value.trim(),c=$('#fc').value.trim();
  if(!n||!c){toast('Preencha o nome e o código NFC.',1);return}
  const old=u&&CAD[t].find(y=>y.uid===u);
  await run(d=>{
    if(!u){d.run('INSERT INTO '+t+' VALUES (?,?,?)',[crypto.randomUUID(),n,c]);return}
    d.run('UPDATE '+t+' SET nome=?,nfc=? WHERE uid=?',[n,c,u]);
    if(old)d.run(k==='p'?'UPDATE abastecimentos SET colaborador=?,cracha_id=? WHERE cracha_id=?':'UPDATE abastecimentos SET maquina=?,totem_id=? WHERE totem_id=?',[n,c,old.nfc]);
  },'admin: '+t);
}
async function delCad(k,u){
  const t=k==='p'?'pessoas':'maquinas';
  if(confirm('Excluir do cadastro? Os abastecimentos antigos continuam no histórico.'))await run(d=>d.run('DELETE FROM '+t+' WHERE uid=?',[u]),'admin: excluir '+t,'Excluído do cadastro.');
}
async function importar(k){
  const t=k==='p'?'pessoas':'maquinas',r=localReg()[k==='p'?'w':'m']||{};
  await run(d=>{for(const id in r)d.run('INSERT OR IGNORE INTO '+t+' VALUES (?,?,?)',[crypto.randomUUID(),r[id],id])},'admin: importar '+t,'Importado do tablet.');
}
async function lerNfc(){
  if(!('NDEFReader' in window)){toast('NFC indisponível neste navegador. Digite o código.',1);return}
  try{
    const c=new AbortController(),r=new NDEFReader();await r.scan({signal:c.signal});toast('Aproxime a tag do tablet.');
    r.onreading=e=>{let id=e.serialNumber;for(const x of e.message.records)if(x.recordType==='text'){id=new TextDecoder(x.encoding||'utf-8').decode(x.data);break}$('#fc').value=id;c.abort();toast('Código lido.')};
  }catch(e){toast('NFC bloqueado: '+e.message,1)}
}
lock();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
