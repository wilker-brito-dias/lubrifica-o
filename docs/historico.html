<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c141d">
<title>Histórico HF28</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0c141d;--ink:#e8eef5;--mut:#8ea0b3;--acc:#f5a524;--ok:#3ddc97;--bad:#ff6b6b;--line:rgba(255,255,255,.13);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 520px at 85% -10%,#21405f 0,transparent 62%),radial-gradient(700px 420px at -10% 110%,#3a2a10 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) clamp(10px,3vw,16px) calc(88px + env(safe-area-inset-bottom))}
#main{width:100%;max-width:720px;margin:0 auto;display:grid;gap:clamp(10px,2.5vw,16px);padding-top:clamp(8px,2.5vw,16px)}
#main>*,.g>*{min-width:0}
h1,h2,h3,p,b,span,label,button,li{overflow-wrap:anywhere}
img,svg{max-width:100%}
h1{font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:1.2;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 .6em}
p{margin:.3em 0}
.m{color:var(--mut)}
.g{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,4vw,22px)}
.b{display:block;width:100%;min-height:58px;margin-top:12px;padding:14px 18px;font:inherit;font-weight:600;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;cursor:pointer}
.b.p{background:var(--acc);border-color:var(--acc);color:#1b1200}
.b:focus-visible,select:focus-visible,#nav button:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:12px}
.kpi b{display:block;font-size:clamp(1.05rem,4.6vw,1.35rem);font-variant-numeric:tabular-nums}
select{display:block;width:100%;max-width:100%;min-width:0;margin-top:6px;padding:14px;font:inherit;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px}
label{display:block;color:var(--mut);font-size:.95rem}
.ls{list-style:none;margin:14px 0 0;padding:0}
.ls li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ls span,.ls small{display:block}
.ls li>div:first-child{flex:1 1 180px;min-width:0}
.lt{text-align:right;font-weight:700;margin-left:auto}
.bar{height:10px;border-radius:6px;background:var(--acc);margin-top:6px}
.bar.ref{height:6px;background:#5d7185}
.bar.alert{background:var(--bad)}
.ok{color:var(--ok)}
.al{padding:10px 14px;border-radius:12px;border:1px solid rgba(245,165,36,.5);background:rgba(245,165,36,.1);margin:10px 0}
.al.crit{border-color:var(--bad);background:rgba(255,107,107,.12)}
.cht{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:14px}
.cht div{flex:1;background:var(--acc);border-radius:4px 4px 0 0}
.cht div.z{opacity:.25}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;min-height:52px;font:inherit;font-weight:600;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px}
.seg button.on{color:#1b1200;background:var(--acc);border-color:var(--acc)}
.r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.pie{display:block;width:min(100%,280px);margin:16px auto}
.lg{list-style:none;margin:8px 0 0;padding:0}
.lg li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lg i{flex:none;width:14px;height:14px;border-radius:4px;margin-top:6px}
.lg div{flex:1}
.lg span{display:block}
.bx{height:16px;border-radius:6px;margin-top:6px}
.mes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0;font-size:clamp(.56rem,2.3vw,.75rem);color:var(--mut);text-align:center}
.mes small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mes i{display:block;width:100%;background:#4cc9f0;border-radius:4px 4px 0 0}
.cht.mm{height:200px}
.ax{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;margin-top:6px;font-size:.85rem;color:var(--mut)}
input{display:block;width:100%;max-width:100%;min-width:0;margin-top:6px;padding:14px;font:inherit;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px}
.rk{display:block;padding:10px 0;border-top:1px solid var(--line)}
.x{background:none;border:1px solid var(--line);color:var(--acc);border-radius:10px;padding:6px 12px;font:inherit;margin-top:4px}
.warn{padding:12px 14px;border-radius:14px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#ffb3b3}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;z-index:5}
#ov[hidden]{display:none}
#ov img{max-width:100%;max-height:100%;border-radius:14px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(12,20,29,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav button{flex:1;min-width:0;min-height:56px;font:inherit;font-size:clamp(.8rem,3.3vw,1rem);font-weight:600;color:var(--mut);background:none;border:1px solid transparent;border-radius:16px}
#nav button.on{color:var(--acc);border-color:var(--acc);background:rgba(245,165,36,.1)}
/* calendário, meses e dias */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{flex:1;text-align:center}
.cal-h button{flex:none;width:48px;height:48px;font:inherit;font-size:1.3rem;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal .wd{text-align:center;font-size:.75rem;color:var(--mut);padding:4px 0}
.cd{position:relative;aspect-ratio:1;min-height:38px;display:grid;place-items:center;padding:0;font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:12px;cursor:pointer}
.cd.has{background:rgba(245,165,36,.14)}
.cd.has::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cd.today{border-color:var(--mut)}
.cd.sel{background:var(--acc);color:#1b1200;font-weight:700}
.cd.sel::after{background:#1b1200}
.cd:focus-visible,.dy:focus-visible,.mt summary:focus-visible,.cal-h button:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
.mt{border-top:1px solid var(--line)}
.mt summary{list-style:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;padding:14px 0;min-height:48px;cursor:pointer}
.mt summary::-webkit-details-marker{display:none}
.mt summary::before{content:"\25B8";color:var(--acc);margin-right:6px;transition:transform .15s}
.mt[open] summary::before{transform:rotate(90deg)}
.mt summary b{flex:1 1 120px}
.dy{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;width:100%;min-height:48px;margin:0 0 6px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.dy.sel{border-color:var(--acc);background:rgba(245,165,36,.14)}
</style>
</head>
<body>
<div id="main"></div>
<div id="ov" hidden onclick="this.hidden=true"><img alt="Foto do visor de dosagem"></div>
<nav id="nav"><button onclick="location.href='index.html'">Abastecer</button><button class="on">Histórico</button><button onclick="location.href='index.html#ajustes'">Ajustes</button></nav>
<script src="gh.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
let ROWS=[],RANK=[],OLEOS=[],OLEO=null,DB=null,F='';
const qry=(d,q)=>{const st=d.prepare(q),o=[];while(st.step())o.push(st.getAsObject());st.free();return o};
const box=h=>$('#main').innerHTML='<section class="g">'+h+'</section>';

async function load(){
  if(!GH.ok()){box('<h1>Histórico</h1><p class="m">Configure o GitHub em Ajustes para ler o banco.</p><button class="b p" onclick="location.href=\'index.html#ajustes\'">Abrir ajustes</button>');return}
  box('<p class="m">Lendo o banco no GitHub...</p>');
  try{
    const cur=await GH.read();
    if(!cur){box('<h1>Histórico</h1><p class="m">Nenhum abastecimento no banco ainda.</p><button class="b" onclick="load()">Atualizar</button>');return}
    const S=await GH.sql(),d=new S.Database(cur.bytes);DB=cur.bytes;GH.prep(d);
    ROWS=qry(d,'SELECT * FROM abastecimentos ORDER BY fim DESC');
    RANK=qry(d,'SELECT maquina,COUNT(*) n,SUM(litros) total,AVG(litros) media FROM abastecimentos GROUP BY maquina ORDER BY total DESC');
    OLEOS=qry(d,'SELECT * FROM oleos');OLEO=OLEOS.find(o=>o.ativo)||OLEOS[0]||null;
    d.close();draw();
  }catch(e){box('<h1>Histórico</h1><p class="warn">Não foi possível ler o banco: '+esc((e&&e.message)||e)+'</p><button class="b" onclick="load()">Tentar de novo</button>')}
}
const DIA=864e5,LIM=()=>+localStorage.getItem('lim')||30;
function analise(){
  const now=Date.now(),res=[],al=[],by={};
  ROWS.forEach(r=>(by[r.maquina]=by[r.maquina]||[]).push(r));
  for(const m in by){
    const rs=by[m],t=r=>now-new Date(r.fim).getTime();
    const w=rs.filter(r=>t(r)<7*DIA),b=rs.filter(r=>t(r)>=7*DIA&&t(r)<35*DIA);
    const sw=w.reduce((s,r)=>s+r.litros,0),sb=b.reduce((s,r)=>s+r.litros,0)/4,ex=sb>0?(sw/sb-1)*100:null;
    res.push({m,sw,sb,ex,alerta:ex!=null&&ex>=LIM()});
    if(ex!=null&&ex>=LIM())al.push({m,crit:ex>=2*LIM(),txt:'Últimos 7 dias: '+fmt(sw)+' L, '+Math.round(ex)+'% acima da média semanal anterior ('+fmt(sb)+' L).'});
    const old=rs.filter(r=>t(r)>=7*DIA);
    if(old.length>=5){
      const av=old.reduce((s,r)=>s+r.litros,0)/old.length,big=w.filter(r=>r.litros>2*av);
      if(big.length)al.push({m,crit:false,txt:big.length+' abastecimento(s) na semana com mais que o dobro do normal (média de '+fmt(av)+' L).'});
    }
  }
  al.sort((a,b)=>b.crit-a.crit);res.sort((a,b)=>b.sw-a.sw);
  return{res,al};
}
const p2=n=>String(n).padStart(2,'0');
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlc=n=>{n=Number(n||0);return n>=1000?'R$ '+fmt(n/1000)+' mil':'R$ '+Math.round(n)};
const brl0=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
let MED='l';
const PRECO=()=>OLEO&&OLEO.preco!=null?OLEO.preco:0;
const custo=r=>r.litros*(r.preco!=null?r.preco:PRECO());
const val=r=>MED==='r'?custo(r):r.litros;
const uf=n=>MED==='r'?brl(n):fmt(n)+' L';
const medSeg=()=>'<div class="seg"><button class="'+(MED==='l'?'on':'')+'" onclick="MED=\'l\';draw()">Litros</button><button class="'+(MED==='r'?'on':'')+'" onclick="MED=\'r\';draw()">Reais (R$)</button></div>';
function oleoSec(){
  if(!OLEO)return'<section class="g"><h2>Óleo em uso</h2><p class="m">Nenhum óleo cadastrado. Cadastre na Administração para calcular os gastos.</p></section>';
  const o=OLEO,L=ROWS.reduce((s,r)=>s+r.litros,0);
  return'<section class="g"><h2>Óleo em uso</h2><p><b>'+esc(o.nome)+'</b> '+esc(o.viscosidade||'')+'</p><p class="m">'
    +(o.codigo?'Requisição: '+esc(o.codigo)+'. ':'')+(o.preco!=null?'Preço: '+brl(o.preco)+' por litro. ':'Preço não informado. ')+(o.fornecedor?'Fornecedor: '+esc(o.fornecedor)+'. ':'')+'Selecionado na tela inicial do app.</p>'
    +(o.bombona>0?'<p class="m">Já consumido: '+fmt(L)+' L, cerca de '+fmt(L/o.bombona)+' bombonas de '+fmt(o.bombona)+' L.</p>':'')+(o.obs?'<p class="m">'+esc(o.obs)+'</p>':'')+'</section>';
}
function gastoMes(){
  const ms=[];
  for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push({k:d.getFullYear()+'-'+p2(d.getMonth()+1),t:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),c:0})}
  ROWS.forEach(r=>{const d=new Date(r.fim),x=ms.find(y=>y.k===d.getFullYear()+'-'+p2(d.getMonth()+1));if(x)x.c+=custo(r)});
  const mx=Math.max(...ms.map(x=>x.c),1),tot=ms.reduce((s,x)=>s+x.c,0);
  return'<section class="g"><h2>Gasto por mês, últimos 6 meses</h2><p class="m">Total no período: '+brl(tot)+', média de '+brl(tot/6)+' por mês.</p><div class="cht mm" role="img" aria-label="Gasto em reais por mês">'
    +ms.map(x=>'<span class="mes"><small>'+brlc(x.c)+'</small><i style="height:'+Math.max(x.c/mx*70,1)+'%"></i>'+esc(x.t)+'</span>').join('')+'</div></section>';
}
let CH={tipo:'pizza',por:'maquina',dias:30};
const COR=['#f5a524','#4cc9f0','#3ddc97','#ff6b6b','#b48cff','#ffd166','#f78fb3','#7ca5ff','#c3e88d'];
function dist(){
  const lim=CH.dias?Date.now()-CH.dias*DIA:0,g={};
  ROWS.filter(r=>!lim||new Date(r.fim).getTime()>=lim).forEach(r=>{const k=r[CH.por]||'(sem nome)',x=g[k]=g[k]||{k,l:0,n:0};x.l+=val(r);x.n++});
  let a=Object.values(g).sort((x,y)=>y.l-x.l);
  if(a.length>9){const o=a.slice(8);a=a.slice(0,8).concat({k:'Outras ('+o.length+')',l:o.reduce((s,x)=>s+x.l,0),n:o.reduce((s,x)=>s+x.n,0)})}
  const tot=a.reduce((s,x)=>s+x.l,0);
  a.forEach((x,i)=>{x.c=COR[i%COR.length];x.p=tot?x.l/tot*100:0});
  const op=(v,t,c)=>'<option value="'+v+'"'+(String(c)===String(v)?' selected':'')+'>'+t+'</option>';
  let h='<section class="g"><h2>Distribuição do consumo</h2>'+medSeg()+'<div class="seg"><button class="'+(CH.tipo==='pizza'?'on':'')+'" onclick="CH.tipo=\'pizza\';draw()">Pizza</button><button class="'+(CH.tipo==='barras'?'on':'')+'" onclick="CH.tipo=\'barras\';draw()">Barras</button></div>'
    +'<div class="r2"><label>Agrupar por<select onchange="CH.por=this.value;draw()">'+op('maquina','Máquina',CH.por)+op('colaborador','Colaborador',CH.por)+'</select></label>'
    +'<label>Período<select onchange="CH.dias=+this.value;draw()">'+op(7,'7 dias',CH.dias)+op(30,'30 dias',CH.dias)+op(90,'90 dias',CH.dias)+op(0,'Tudo',CH.dias)+'</select></label></div>';
  if(!tot)return h+'<p class="m">Sem abastecimentos neste período.</p></section>';
  if(CH.tipo==='pizza'){
    let off=25,sl='';
    a.forEach(x=>{sl+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+x.c+'" stroke-width="7" stroke-dasharray="'+x.p+' '+(100-x.p)+'" stroke-dashoffset="'+off+'"></circle>';off-=x.p});
    h+='<svg class="pie" viewBox="0 0 42 42" role="img" aria-label="Gráfico de pizza do consumo em litros"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"></circle>'+sl+'<text x="21" y="22.4" text-anchor="middle" font-size="'+(MED==='r'?3.2:4.4)+'" font-weight="700" fill="#e8eef5">'+(MED==='r'?brl(tot):fmt(tot)+' L')+'</text></svg>';
  }
  const mx=a[0].l;
  return h+'<ul class="lg">'+a.map(x=>'<li><i style="background:'+x.c+'"></i><div><b>'+esc(x.k)+'</b><span class="m">'+uf(x.l)+', '+x.p.toFixed(1).replace('.',',')+'% do total</span><span class="m">'+x.n+' abastecimentos, média de '+uf(x.l/x.n)+'</span>'+(CH.tipo==='barras'?'<div class="bx" style="width:'+Math.max(2,x.l/mx*100)+'%;background:'+x.c+'"></div>':'')+'</div></li>').join('')+'</ul></section>';
}
/* ---------- Registros por data: calendário, meses e dias ---------- */
const dkey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nomeMes=(y,m)=>cap(new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
const nomeDia=k=>{const[y,m,d]=k.split('-').map(Number);return cap(new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))};
let SELK='',CAL=null;
const OPEN=new Set();
const visiveis=()=>F?ROWS.filter(r=>r.maquina===F):ROWS;
function selMaq(){
  return'<label>Máquina<select onchange="F=this.value;draw()"><option value="">Todas</option>'+RANK.map(r=>'<option'+(r.maquina===F?' selected':'')+'>'+esc(r.maquina)+'</option>').join('')+'</select></label>';
}
function porDia(rows){
  const g={};
  for(const r of rows){const k=dkey(new Date(r.fim)),x=g[k]||(g[k]={n:0,l:0,c:0});x.n++;x.l+=r.litros;x.c+=custo(r)}
  return g;
}
function initSel(){
  if(SELK)return;
  const ks=Object.keys(porDia(visiveis())).sort();
  SELK=ks.length?ks[ks.length-1]:dkey(new Date());
  const[y,m]=SELK.split('-').map(Number);CAL={y,m:m-1};OPEN.add(SELK.slice(0,7));
}
function calHtml(g){
  const{y,m}=CAL,hoje=dkey(new Date()),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let c='<div class="cal-h"><button onclick="calNav(-1)" aria-label="Mês anterior">&#8249;</button><b>'+esc(nomeMes(y,m))+'</b><button onclick="calNav(1)" aria-label="Próximo mês">&#8250;</button></div><div class="cal">'
    +['D','S','T','Q','Q','S','S'].map(x=>'<span class="wd">'+x+'</span>').join('');
  for(let i=0;i<ini;i++)c+='<span></span>';
  for(let d=1;d<=n;d++){
    const k=y+'-'+p2(m+1)+'-'+p2(d),x=g[k];
    c+='<button class="cd'+(x?' has':'')+(k===SELK?' sel':'')+(k===hoje?' today':'')+'" data-d="'+k+'" aria-pressed="'+(k===SELK)+'" aria-label="'+esc(nomeDia(k))+(x?', '+x.n+' abastecimentos':'')+'" onclick="pick(this.dataset.d)">'+d+'</button>';
  }
  return c+'</div><div class="row"><button class="b" onclick="pick(dkey(new Date()))">Hoje</button><button class="b" onclick="pickMes()">Ver o mês inteiro</button></div>';
}
function treeHtml(g){
  const ms={};
  Object.keys(g).sort().reverse().forEach(k=>{const mk=k.slice(0,7),x=g[k],t=ms[mk]||(ms[mk]={n:0,l:0,c:0,ds:[]});t.n+=x.n;t.l+=x.l;t.c+=x.c;t.ds.push(k)});
  const ks=Object.keys(ms);
  if(!ks.length)return'<p class="m">Nenhum registro.</p>';
  return ks.map(mk=>{
    const t=ms[mk],[y,m]=mk.split('-').map(Number);
    return'<details class="mt"'+(OPEN.has(mk)?' open':'')+' ontoggle="togM(\''+mk+'\',this.open)"><summary><b>'+esc(nomeMes(y,m-1))+'</b><span class="m">'+t.n+' abast., '+fmt(t.l)+' L, '+brl(t.c)+'</span></summary>'
      +'<button class="dy'+(SELK===mk?' sel':'')+'" onclick="pick(\''+mk+'\')"><b>Mês inteiro</b><span class="m">'+t.n+' abastecimentos</span></button>'
      +t.ds.map(k=>{const x=g[k],d=Number(k.slice(8));return'<button class="dy'+(k===SELK?' sel':'')+'" onclick="pick(\''+k+'\')"><b>'+p2(d)+', '+esc(new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'short'}))+'</b><span class="m">'+x.n+' abast., '+fmt(x.l)+' L, '+brl(x.c)+'</span></button>'}).join('')+'</details>';
  }).join('');
}
const rowHtml=r=>{
  const d=new Date(r.fim),h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),dia=SELK.length===7?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' ':'';
  const dur=r.duracao_s?', bomba ligada por '+Math.floor(r.duracao_s/60)+' min '+(r.duracao_s%60)+' s':'';
  return'<li><div><b>'+esc(r.maquina)+'</b><span class="m">'+dia+h+', '+esc(r.colaborador)+'</span><span class="m">'+esc(r.oleo||r.produto||'')+dur+'</span>'+(r.obs?'<span class="m">'+esc(r.obs)+'</span>':'')
    +'</div><div class="lt">'+fmt(r.litros)+' L<span class="m">'+brl(custo(r))+'</span>'+(r.foto?'<button class="x" data-p="'+esc(r.foto)+'" onclick="foto(this.dataset.p)">Ver foto</button>':'')+'</div></li>';
};
function diaHtml(rows){
  const sel=rows.filter(r=>dkey(new Date(r.fim)).startsWith(SELK)).sort((a,b)=>a.fim<b.fim?1:-1);
  const L=sel.reduce((s,r)=>s+r.litros,0),C=sel.reduce((s,r)=>s+custo(r),0);
  const tit=SELK.length===7?nomeMes(+SELK.slice(0,4),+SELK.slice(5)-1):nomeDia(SELK);
  return'<h2>'+esc(tit)+(F?' ('+esc(F)+')':'')+'</h2><p class="m">'+sel.length+' abastecimentos, '+fmt(L)+' L, '+brl(C)+'</p><ul class="ls">'+(sel.map(rowHtml).join('')||'<li class="m">Nenhum abastecimento neste período.</li>')+'</ul>';
}
const datasHtml=()=>'<section class="g"><h2>Registros por data</h2>'+selMaq()+'<div id="cal"></div></section><section class="g"><h2>Meses e dias</h2><div id="tree"></div></section><section class="g" id="dia"></section>';
function drawDatas(){
  const rows=visiveis(),g=porDia(rows),c=$('#cal'),t=$('#tree'),d=$('#dia');
  if(c)c.innerHTML=calHtml(g);
  if(t)t.innerHTML=treeHtml(g);
  if(d)d.innerHTML=diaHtml(rows);
}
function calNav(dl){const d=new Date(CAL.y,CAL.m+dl,1);CAL={y:d.getFullYear(),m:d.getMonth()};drawDatas()}
function togM(mk,o){if(o)OPEN.add(mk);else OPEN.delete(mk)}
function pick(k){
  SELK=k;const[y,m]=k.split('-').map(Number);CAL={y,m:m-1};OPEN.add(k.slice(0,7));
  drawDatas();
  const e=$('#dia');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'});
}
function pickMes(){pick(CAL.y+'-'+p2(CAL.m+1))}

function draw(){
  initSel();
  const rows=F?ROWS.filter(r=>r.maquina===F):ROWS,hoje=new Date().toDateString();
  const tot=rows.reduce((s,r)=>s+r.litros,0),th=rows.filter(r=>new Date(r.fim).toDateString()===hoje).reduce((s,r)=>s+r.litros,0);
  const ct=f=>rows.filter(f).reduce((s,r)=>s+custo(r),0),gt=ct(()=>1),ghj=ct(r=>new Date(r.fim).toDateString()===hoje),g30=ct(r=>Date.now()-new Date(r.fim).getTime()<30*DIA);
  const{res,al}=analise(),base=res.some(r=>r.ex!=null),sd=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const dias=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*DIA);dias.push({d,k:d.toLocaleDateString('pt-BR'),v:0})}
  rows.forEach(r=>{const x=dias.find(y=>y.k===new Date(r.fim).toLocaleDateString('pt-BR'));if(x)x.v+=val(r)});
  const mx=Math.max(...dias.map(x=>x.v),1),pk=dias.reduce((a,b)=>b.v>a.v?b:a),mx2=Math.max(...res.map(r=>Math.max(r.sw,r.sb)),1);
  $('#main').innerHTML=
   '<section class="g"><h1>Histórico</h1><div class="kpi"><p class="m"><b>'+rows.length+'</b>abastecimentos</p><p class="m"><b>'+fmt(tot)+'</b>litros no total</p><p class="m"><b>'+brl(gt)+'</b>gasto total</p><p class="m"><b>'+fmt(th)+'</b>litros hoje</p><p class="m"><b>'+brl(ghj)+'</b>gasto hoje</p><p class="m"><b>'+brl(g30)+'</b>gasto em 30 dias</p></div>'
   +'<div class="row"><button class="b" onclick="load()">Atualizar</button><button class="b" onclick="baixar()">Baixar banco (.db)</button></div></section>'
   +oleoSec()
   +'<section class="g"><h2>Alertas de consumo</h2>'
   +(al.length?al.map(a=>'<p class="al'+(a.crit?' crit':'')+'"><b>'+esc(a.m)+'</b> ('+(a.crit?'crítico':'atenção')+')<br>'+a.txt+'</p>').join(''):base?'<p class="ok">Nenhuma máquina com consumo acima do limite.</p>':'<p class="m">Ainda não há histórico de mais de 7 dias para comparar o consumo.</p>')
   +'<label>Limite de alerta (% acima da média semanal)<input type="number" inputmode="numeric" min="5" step="5" value="'+LIM()+'" onchange="localStorage.setItem(\'lim\',this.value||30);draw()"></label></section>'
   +datasHtml()
   +'<section class="g"><h2>Consumo diário, últimos 30 dias</h2>'+medSeg()+selMaq()
   +'<div class="cht" role="img" aria-label="Litros abastecidos por dia nos últimos 30 dias">'+dias.map(x=>'<div'+(x.v?'':' class="z"')+' style="height:'+Math.max(x.v/mx*100,1.5)+'%"></div>').join('')+'</div>'
   +'<div class="ax"><span>'+sd(dias[0].d)+'</span><span>pico: '+uf(pk.v)+' em '+sd(pk.d)+'</span><span>hoje</span></div></section>'
   +dist()+gastoMes()
   +'<section class="g"><h2>Esta semana contra a média</h2><p class="m">Barra grossa: últimos 7 dias. Barra fina: média semanal das 4 semanas anteriores. Vermelho: acima do limite.</p>'
   +(res.map(r=>'<span class="rk"><b>'+esc(r.m)+'</b><span class="m"> '+fmt(r.sw)+' L'+(r.sb?', média anterior '+fmt(r.sb)+' L':'')+'</span><div class="bar'+(r.alerta?' alert':'')+'" style="width:'+Math.max(2,r.sw/mx2*100)+'%"></div>'+(r.sb?'<div class="bar ref" style="width:'+Math.max(2,r.sb/mx2*100)+'%"></div>':'')+'</span>').join('')||'<p class="m">Sem dados.</p>')+'</section>'
   +'';
  drawDatas();
}
async function foto(p){
  try{const r=await fetch(GH.u(p,1),{headers:GH.h(1)});if(!r.ok)throw new Error('GitHub '+r.status);$('#ov img').src=URL.createObjectURL(await r.blob());$('#ov').hidden=false}
  catch(e){alert('Não foi possível abrir a foto: '+e.message)}
}
function baixar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([DB]));a.download='abastecimentos.db';a.click()}
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
